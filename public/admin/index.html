<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pet Adoption - Content Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Prompt:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Inter', 'Prompt', sans-serif;
      background-color: #181826;
      color: #e0e0e0;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Leftmost Icon Bar */
    .icon-bar {
      width: 56px;
      background-color: #1e1e2f;
      border-right: 1px solid #27273e;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px 0;
      gap: 20px;
    }
    .logo-box {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, #4945ff 0%, #0284c7 100%);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      cursor: pointer;
    }
    .icon-btn {
      color: #8f92a1;
      font-size: 18px;
      cursor: pointer;
      transition: color 0.2s;
      padding: 8px;
      border-radius: 6px;
    }
    .icon-btn.active, .icon-btn:hover {
      color: #ffffff;
      background-color: #27273e;
    }
    .user-avatar {
      margin-top: auto;
      width: 32px;
      height: 32px;
      background-color: #4945ff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 12px;
      color: white;
    }

    /* Secondary Sidebar: Collection Types */
    .collection-sidebar {
      width: 230px;
      background-color: #181826;
      border-right: 1px solid #27273e;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .sidebar-title {
      font-size: 16px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.3px;
    }
    .search-box {
      width: 100%;
      padding: 8px 12px;
      background-color: #212134;
      border: 1px solid #32324d;
      border-radius: 6px;
      color: #ffffff;
      font-size: 13px;
      outline: none;
    }
    .search-box:focus {
      border-color: #4945ff;
    }
    .section-label {
      font-size: 11px;
      font-weight: 700;
      color: #8e8ea9;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 10px;
    }
    .count-badge {
      background-color: #2a2a40;
      color: #a5a5ba;
      padding: 1px 6px;
      border-radius: 10px;
      font-size: 10px;
    }
    .nav-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 13px;
      color: #c0c0cf;
      cursor: pointer;
      transition: background-color 0.2s, color 0.2s;
    }
    .nav-item::before {
      content: "•";
      font-size: 16px;
      color: #666687;
    }
    .nav-item.active {
      background-color: #27273e;
      color: #ffffff;
      font-weight: 600;
    }
    .nav-item.active::before {
      color: #4945ff;
    }
    .nav-item:hover {
      background-color: #212134;
      color: #ffffff;
    }

    /* Main Content Area */
    .main-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      background-color: #12121f;
    }
    .top-header {
      padding: 30px 40px 10px 40px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }
    .back-link {
      font-size: 12px;
      color: #7b79ff;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 8px;
      cursor: pointer;
    }
    .page-title {
      font-size: 26px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.5px;
    }
    .page-subtitle {
      font-size: 13px;
      color: #8e8ea9;
      margin-top: 4px;
    }
    .header-actions {
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .btn-create {
      background-color: #4945ff;
      color: #ffffff;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: background-color 0.2s;
    }
    .btn-create:hover {
      background-color: #3b37e0;
    }

    /* Action Filter Bar */
    .filter-bar {
      padding: 16px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .filter-left {
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .btn-filter {
      background-color: #212134;
      border: 1px solid #32324d;
      color: #c0c0cf;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn-filter:hover {
      background-color: #27273e;
      color: #ffffff;
    }

    /* Content Table */
    .table-container {
      margin: 0 40px 40px 40px;
      background-color: #181826;
      border: 1px solid #27273e;
      border-radius: 8px;
      overflow: hidden;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 13px;
    }
    th {
      background-color: #1e1e2f;
      color: #8e8ea9;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 12px 16px;
      border-bottom: 1px solid #27273e;
    }
    td {
      padding: 14px 16px;
      border-bottom: 1px solid #222236;
      color: #c0c0cf;
      vertical-align: middle;
    }
    tr:last-child td {
      border-bottom: none;
    }
    tr:hover td {
      background-color: #1c1c2e;
    }
    .badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
    }
    .badge-green { background-color: rgba(34, 197, 94, 0.15); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.3); }
    .badge-blue { background-color: rgba(56, 189, 248, 0.15); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.3); }
    .badge-yellow { background-color: rgba(234, 179, 8, 0.15); color: #facc15; border: 1px solid rgba(234, 179, 8, 0.3); }
    .badge-purple { background-color: rgba(168, 85, 247, 0.15); color: #c084fc; border: 1px solid rgba(168, 85, 247, 0.3); }

    /* Modal Form */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .modal-box {
      width: 520px;
      background: #1e1e2f;
      border: 1px solid #32324d;
      border-radius: 10px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .modal-title {
      font-size: 18px;
      font-weight: 700;
      color: #ffffff;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .form-group label {
      font-size: 12px;
      font-weight: 600;
      color: #a5a5ba;
    }
    .form-group input, .form-group textarea, .form-group select {
      background: #27273e;
      border: 1px solid #3b3b5c;
      border-radius: 6px;
      padding: 8px 12px;
      color: #ffffff;
      font-size: 13px;
      outline: none;
    }
    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 10px;
    }
    .btn-cancel {
      background: #27273e;
      border: 1px solid #3b3b5c;
      color: #c0c0cf;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Leftmost Icon Bar -->
  <div class="icon-bar">
    <div class="logo-box">🐾</div>
    <div class="icon-btn active" title="Content Manager">📝</div>
    <div class="icon-btn" title="Media Library">🖼️</div>
    <div class="icon-btn" title="Settings">⚙️</div>
    <div class="user-avatar" title="Admin">SN</div>
  </div>

  <!-- Secondary Sidebar: Collection Types -->
  <div class="collection-sidebar">
    <div class="sidebar-title">Content Manager</div>
    <input type="text" class="search-box" placeholder="Search..." id="sidebarSearch">

    <div class="section-label">
      <span>COLLECTION TYPES</span>
      <span class="count-badge" id="typesCount">6</span>
    </div>

    <ul class="nav-list" id="collectionNav">
      <li class="nav-item active" data-type="category">Category</li>
      <li class="nav-item" data-type="shelter">Shelter</li>
      <li class="nav-item" data-type="pet">Pet</li>
      <li class="nav-item" data-type="application">Adoption Application</li>
      <li class="nav-item" data-type="inquiry">Pet Comment</li>
      <li class="nav-item" data-type="user">User</li>
    </ul>

    <div class="section-label" style="margin-top: 20px;">
      <span>SINGLE TYPES</span>
      <span class="count-badge">0</span>
    </div>
  </div>

  <!-- Main Content Area -->
  <div class="main-area">
    <div class="top-header">
      <div>
        <a class="back-link">← Back</a>
        <h1 class="page-title" id="viewTitle">Category</h1>
        <div class="page-subtitle" id="viewSubtitle">Loading entries...</div>
      </div>
      <div class="header-actions">
        <button class="btn-create" onclick="openCreateModal()">
          <span>+</span> Create new entry
        </button>
      </div>
    </div>

    <div class="filter-bar">
      <div class="filter-left">
        <input type="text" class="search-box" style="width: 220px;" placeholder="Search..." id="tableSearch" onkeyup="filterTable()">
        <button class="btn-filter">⚡ Filters</button>
      </div>
      <button class="btn-filter">⚙️</button>
    </div>

    <div class="table-container">
      <table id="dataTable">
        <thead id="tableHead"></thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </div>

  <!-- Create Entry Modal -->
  <div class="modal-overlay" id="createModal">
    <div class="modal-box">
      <div class="modal-title" id="modalTitle">Create new entry</div>
      <div id="modalFormFields"></div>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeCreateModal()">Cancel</button>
        <button class="btn-create" onclick="submitNewEntry()">Save</button>
      </div>
    </div>
  </div>

  <script>
    let currentType = 'category';
    let currentData = [];

    // Mock/Initial sample data mapped from schema
    const dataStore = {
      category: [
        { id: 1, name: "Dog / สุนัข", description: "Friendly canines looking for loving homes", pets: "3 items" },
        { id: 2, name: "Cat / แมว", description: "Affectionate and playful cats and kittens", pets: "2 items" },
        { id: 3, name: "Rabbit / กระต่าย", description: "Gentle and cuddly bunnies seeking quiet homes", pets: "1 item" },
        { id: 4, name: "Bird / นก", description: "Colorful and cheerful companion birds", pets: "0 items" }
      ],
      shelter: [
        { id: 1, name: "Bangkok Paws Rescue Shelter", location: "Chatuchak, Bangkok", phone: "02-123-4567", email: "contact@bangkokpaws.org" },
        { id: 2, name: "Chiang Mai Animal Haven", location: "Mae Rim, Chiang Mai", phone: "053-987-654", email: "haven@cm-animals.org" }
      ],
      pet: [
        { id: 1, name: "Milo", breed: "Golden Retriever Mix", age: "14 months", gender: "MALE", status: "AVAILABLE", category: "Dog" },
        { id: 2, name: "Luna", breed: "British Shorthair", age: "8 months", gender: "FEMALE", status: "AVAILABLE", category: "Cat" },
        { id: 3, name: "Coco", breed: "Holland Lop", age: "6 months", gender: "FEMALE", status: "AVAILABLE", category: "Rabbit" },
        { id: 4, name: "Rocky", breed: "Siberian Husky", age: "24 months", gender: "MALE", status: "PENDING", category: "Dog" },
        { id: 5, name: "Bella", breed: "Persian Cat", age: "18 months", gender: "FEMALE", status: "ADOPTED", category: "Cat" }
      ],
      application: [
        { id: 1, pet: "Milo (Dog)", applicant: "somchai@gmail.com", status: "SUBMITTED", living: "Single House", date: "2026-10-05" },
        { id: 2, pet: "Rocky (Dog)", applicant: "jane@company.com", status: "UNDER_REVIEW", living: "Townhome with yard", date: "2026-10-04" },
        { id: 3, pet: "Bella (Cat)", applicant: "mark@tech.io", status: "APPROVED", living: "Condo (Pet-friendly)", date: "2026-10-02" }
      ],
      inquiry: [
        { id: 1, pet: "Milo", user: "somchai@gmail.com", message: "น้องเข้ากับแมวหรือเด็กเล็กได้ดีไหมครับ?", date: "2026-10-05" },
        { id: 2, pet: "Luna", user: "ananya@mail.com", message: "มีวัคซีนครบทุกเข็มแล้วหรือยังคะ?", date: "2026-10-05" }
      ],
      user: [
        { id: 1, email: "admin@petadoption.local", role: "ADMIN", name: "Super Admin", phone: "0800000001" },
        { id: 2, email: "staff@petadoption.local", role: "SHELTER_STAFF", name: "Shelter Staff", phone: "0800000002" },
        { id: 3, email: "adopter1@petadoption.local", role: "ADOPTER", name: "Somchai Jaidee", phone: "0812345678" }
      ]
    };

    // Columns config
    const columnsConfig = {
      category: [
        { key: "id", label: "ID" },
        { key: "name", label: "NAME" },
        { key: "description", label: "DESCRIPTION" },
        { key: "pets", label: "PETS" }
      ],
      shelter: [
        { key: "id", label: "ID" },
        { key: "name", label: "NAME" },
        { key: "location", label: "LOCATION" },
        { key: "phone", label: "PHONE" },
        { key: "email", label: "EMAIL" }
      ],
      pet: [
        { key: "id", label: "ID" },
        { key: "name", label: "NAME" },
        { key: "category", label: "CATEGORY" },
        { key: "breed", label: "BREED" },
        { key: "age", label: "AGE" },
        { key: "gender", label: "GENDER" },
        { key: "status", label: "STATUS", badge: true }
      ],
      application: [
        { key: "id", label: "ID" },
        { key: "pet", label: "PET" },
        { key: "applicant", label: "APPLICANT" },
        { key: "living", label: "LIVING CONDITION" },
        { key: "status", label: "STATUS", badge: true },
        { key: "date", label: "DATE" }
      ],
      inquiry: [
        { key: "id", label: "ID" },
        { key: "pet", label: "PET" },
        { key: "user", label: "USER" },
        { key: "message", label: "MESSAGE" },
        { key: "date", label: "DATE" }
      ],
      user: [
        { key: "id", label: "ID" },
        { key: "email", label: "EMAIL" },
        { key: "name", label: "NAME" },
        { key: "role", label: "ROLE", badge: true },
        { key: "phone", label: "PHONE" }
      ]
    };

    function renderCollection(type) {
      currentType = type;
      const titleMap = {
        category: "Category",
        shelter: "Shelter",
        pet: "Pet",
        application: "Adoption Application",
        inquiry: "Pet Comment / Inquiry",
        user: "User"
      };

      document.getElementById('viewTitle').textContent = titleMap[type];
      const items = dataStore[type] || [];
      document.getElementById('viewSubtitle').textContent = `${items.length} entries found`;

      // Render Head
      const cols = columnsConfig[type];
      let headHtml = `<tr><th style="width: 40px;"><input type="checkbox"></th>`;
      cols.forEach(col => {
        headHtml += `<th>${col.label}</th>`;
      });
      headHtml += `<th style="text-align: right;">ACTIONS</th></tr>`;
      document.getElementById('tableHead').innerHTML = headHtml;

      // Render Body
      renderRows(items);
    }

    function renderRows(items) {
      const cols = columnsConfig[currentType];
      let bodyHtml = '';
      items.forEach(item => {
        bodyHtml += `<tr><td><input type="checkbox"></td>`;
        cols.forEach(col => {
          let val = item[col.key] || '-';
          if (col.badge) {
            let badgeClass = 'badge-blue';
            if (val === 'AVAILABLE' || val === 'APPROVED' || val === 'ADMIN') badgeClass = 'badge-green';
            if (val === 'PENDING' || val === 'UNDER_REVIEW' || val === 'SHELTER_STAFF') badgeClass = 'badge-yellow';
            if (val === 'ADOPTED' || val === 'REJECTED') badgeClass = 'badge-purple';
            bodyHtml += `<td><span class="badge ${badgeClass}">${val}</span></td>`;
          } else {
            bodyHtml += `<td>${val}</td>`;
          }
        });
        bodyHtml += `<td style="text-align: right;"><button class="btn-filter" onclick="deleteEntry(${item.id})">Delete</button></td></tr>`;
      });
      document.getElementById('tableBody').innerHTML = bodyHtml;
    }

    function filterTable() {
      const q = document.getElementById('tableSearch').value.toLowerCase();
      const items = dataStore[currentType] || [];
      const filtered = items.filter(item => {
        return Object.values(item).some(val => String(val).toLowerCase().includes(q));
      });
      renderRows(filtered);
    }

    // Navigation Click
    document.querySelectorAll('#collectionNav .nav-item').forEach(item => {
      item.addEventListener('click', () => {
        document.querySelectorAll('#collectionNav .nav-item').forEach(el => el.classList.remove('active'));
        item.classList.add('active');
        renderCollection(item.getAttribute('data-type'));
      });
    });

    // Create Modal
    function openCreateModal() {
      document.getElementById('modalTitle').textContent = `Create new ${document.getElementById('viewTitle').textContent}`;
      const cols = columnsConfig[currentType].filter(c => c.key !== 'id');
      let fieldsHtml = '';
      cols.forEach(c => {
        fieldsHtml += `
          <div class="form-group">
            <label>${c.label}</label>
            <input type="text" id="input_${c.key}" placeholder="Enter ${c.label.toLowerCase()}...">
          </div>
        `;
      });
      document.getElementById('modalFormFields').innerHTML = fieldsHtml;
      document.getElementById('createModal').style.display = 'flex';
    }

    function closeCreateModal() {
      document.getElementById('createModal').style.display = 'none';
    }

    function submitNewEntry() {
      const cols = columnsConfig[currentType].filter(c => c.key !== 'id');
      const newEntry = { id: (dataStore[currentType].length + 1) };
      cols.forEach(c => {
        newEntry[c.key] = document.getElementById(`input_${c.key}`).value || 'N/A';
      });
      dataStore[currentType].unshift(newEntry);
      closeCreateModal();
      renderCollection(currentType);
    }

    function deleteEntry(id) {
      dataStore[currentType] = dataStore[currentType].filter(item => item.id !== id);
      renderCollection(currentType);
    }

    // Init
    renderCollection('category');
  </script>
</body>
</html>
